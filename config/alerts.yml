groups:
  - name: paxosvault
    rules:
      - alert: LedgerMajorityUnreachable
        expr: sum(up{job="paxosvault"}) < 2
        for: 5s
        labels:
          severity: critical
        annotations:
          summary: "Fewer than two ledger members can be scraped"
      - alert: LedgerNoObservedLeader
        expr: sum(ledger_leader) < 1
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "No reachable member reports leadership"
      - alert: LedgerSupplyMismatch
        expr: ledger_total_cents != 1000000000000
        for: 2s
        labels:
          severity: critical
        annotations:
          summary: "A member reports a violated money-conservation invariant"
